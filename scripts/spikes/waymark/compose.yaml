# Disposable DATABASE ONLY. Never connects to the application stack.
# This recipe was reviewed, not executed in the Docker-less agent sandbox.
name: nautionette-waymark-spike
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spike
      POSTGRES_PASSWORD: local-spike-only
      POSTGRES_DB: spike
    ports:
      - "127.0.0.1:25432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/spike.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spike -d spike"]
      interval: 2s
      timeout: 5s
      retries: 20
