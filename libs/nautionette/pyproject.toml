[project]
name = "nautionette"
version = "0.1.0"
description = "Shared workflow manifest schema and source helpers"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.23",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<1",
    "opentelemetry-instrumentation-httpx>=0.65b0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
