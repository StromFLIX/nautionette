name: CI

# Every push to main and every pull request: lint, build the app, and run the
# one check that needs no running stack. Anything needing a model key lives in
# smoke.yml, because it costs money and cannot run on a fork.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    services:
      maxio:
        image: ghcr.io/coollabsio/maxio:0.4.2
        env:
          MAXIO_ACCESS_KEY: nautionette-ci-only
          MAXIO_SECRET_KEY: not-for-production-ci-maxio-secret
          MAXIO_DEFAULT_BUCKETS: nautionette-test-outputs
        ports:
          - 9000/tcp
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag, so this is pinned exactly.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install workspace
        run: uv sync --locked --all-packages

      - name: Canonical image fingerprints match repository source
        run: python3 services/docker-broker/nautionette_docker_broker/image_context.py --check-lock

      - name: Lint
        run: uv run ruff check --output-format github .

      - name: Format
        run: uv run ruff format --check .

      - name: Deployment, snapshot, gateway buffers and agent image safety tests
        run: uv run pytest tests/test_coolify_release.py tests/test_cli_oauth_deployment.py tests/worker/test_prepare_release.py tests/test_publish_agent_images.py tests/test_miniapp_smoke.py tests/test_staging_refresh.py tests/agentgateway tests/broker/test_broker.py tests/broker/test_chat_sessions.py tests/broker/test_chat_recovery.py tests/broker/test_sandbox_network.py

      - name: Native creative app release contracts, installer isolation and Settings
        run: uv run pytest tests/lib/test_artcraft.py tests/broker/test_artcraft.py tests/broker/test_artcraft_offline.py tests/backend/test_artcraft.py tests/test_artcraft_deployment.py

      - name: OpenTelemetry privacy boundary
        run: uv run pytest tests/lib/test_telemetry.py tests/lib/test_telemetry_http.py

      - name: Model capability, images and durable chat output guards
        run: uv run pytest tests/backend/test_catalog.py tests/backend/test_model_limits.py tests/backend/test_model_capabilities.py tests/backend/test_chat_images.py tests/backend/test_chat_outputs.py tests/backend/test_output_storage.py

      - name: Real MaxIO binary uploads, large-file restore, integrity and migration
        env:
          MAXIO_TEST_ENDPOINT: http://127.0.0.1:${{ job.services.maxio.ports[9000] }}
          MAXIO_TEST_ACCESS_KEY: nautionette-ci-only
          MAXIO_TEST_SECRET_KEY: not-for-production-ci-maxio-secret
          MAXIO_TEST_BUCKET: nautionette-test-outputs
        run: uv run pytest tests/backend/test_output_maxio.py

      - name: Model integrations, dictation and OAuth sign-in
        run: uv run pytest tests/backend/test_copilot_login.py tests/backend/test_mcp_oauth.py tests/backend/test_mcp_http_oauth.py tests/backend/test_mcp_stdio.py tests/backend/test_mcp_servers.py tests/backend/test_integrations.py tests/backend/test_events_and_clients.py tests/backend/test_live_connections.py tests/backend/test_speech.py

      - name: CLI OAuth end-to-end with pinned real agentgateway (no provider account)
        run: |
          curl --fail --location --retry 2 -o "$RUNNER_TEMP/agentgateway" https://github.com/agentgateway/agentgateway/releases/download/v1.7.0/agentgateway-linux-amd64
          echo "1b2fc01a2de29ca113bbb6258b5cae7b1eb3c724071c09d687a449132f2f42f8  $RUNNER_TEMP/agentgateway" | sha256sum --check
          chmod +x "$RUNNER_TEMP/agentgateway"
          NAUTIONETTE_TEST_GATEWAY_BINARY="$RUNNER_TEMP/agentgateway" uv run pytest tests/backend/test_mcp_oauth_e2e.py tests/backend/test_mcp_http_oauth_e2e.py tests/agentgateway/test_stdio_runtime.py

      - name: Agent defaults, profiles and durable chat configuration
        run: uv run pytest tests/backend/test_agent_profiles.py tests/backend/test_agent_grouping.py tests/backend/test_subagents.py tests/backend/test_reasoning.py tests/backend/test_settings.py tests/backend/test_chats.py tests/backend/test_backend_mcp.py tests/backend/test_chat_inspection.py tests/backend/test_activity_timing.py

      - name: Database upgrades, API retirement and workflow transports
        run: uv run pytest tests/backend/test_db.py tests/backend/test_retired_features.py tests/backend/test_miniapps.py tests/backend/test_miniapp_development.py tests/broker/test_miniapps.py tests/broker/test_miniapp_networks.py tests/broker/test_image_context.py tests/workflow_mcp/test_tools.py tests/backend/test_gateway_mcp.py tests/backend/test_temporal_schedules.py

      - name: Workflow history expiry, retention and run recovery
        run: uv run pytest tests/backend/test_run_retention.py tests/backend/test_runs.py tests/backend/test_execution_graph.py tests/backend/test_internal.py tests/backend/test_schedule_recovery.py tests/backend/test_run_statistics.py tests/worker/test_activities.py

      - name: Indexed conversation search, synchronization and fallback
        run: uv run pytest tests/backend/test_chat_search.py

      - name: Pinned local model and real semantic retrieval (offline inference)
        env:
          SEARCH_TEST_MODEL_CACHE: ${{ runner.temp }}/search-model
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          uv run python -c "import os; from nautionette_backend.search_model import load_encoder; load_encoder(os.environ['SEARCH_TEST_MODEL_CACHE'])"
          uv run pytest tests/backend/test_chat_search_model.py

      - name: Backend restart draining and safe crash recovery
        run: uv run pytest tests/backend/test_chat_draining.py tests/backend/test_chat_restart_process.py tests/backend/test_chat_recovery.py tests/backend/test_chat_queue.py tests/backend/test_chat_activity.py tests/backend/test_chat_sessions.py

      - name: GitHub connections, migrations and project credentials
        run: uv run pytest tests/backend/test_github_connections.py tests/backend/test_github_setup.py tests/backend/test_projects.py tests/backend/test_project_changes.py tests/backend/test_project_credentials.py tests/broker/test_projects.py tests/broker/test_git_credentials.py

      - name: Committed workflows still validate
        run: uv run --package nautionette-workflow-mcp python scripts/check_workflows.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      # ci, not install: it fails when package.json and the lockfile disagree.
      - name: Install
        run: npm ci

      - name: Frontend unit tests
        run: npm test

      - name: Website release download contracts
        run: npm run test:website

      - name: Build
        run: npm run build

      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Chat, settings, extensions and theme controls
        run: >-
          npx playwright test
          tests/speech.spec.js tests/chat.spec.js tests/chat-row.spec.js tests/chat-ordering.spec.js tests/live-connection.spec.js tests/appearance.spec.js tests/workspace.spec.js
          tests/projects.spec.js tests/settings-navigation.spec.js tests/command-palette.spec.js tests/hybrid-search.spec.js
          tests/git-authorship.spec.js tests/system.spec.js tests/agent-profiles.spec.js tests/agent-views.spec.js tests/subagents.spec.js
          tests/packages.spec.js tests/new-chat-settings.spec.js tests/new-chat.spec.js
          tests/copilot-login.spec.js tests/mcp-oauth.spec.js tests/mcp-http-oauth.spec.js tests/mcp-stdio.spec.js tests/tool-calls.spec.js tests/activity-timing.spec.js
          tests/workflow-inputs.spec.js tests/run-retention.spec.js tests/run-statistics.spec.js tests/outputs.spec.js tests/creative-apps.spec.js tests/storage.spec.js tests/navigation.spec.js tests/miniapps.spec.js
          --workers=1 --reporter=dot,github

      - name: Live stream recovery and navigation (WebKit)
        run: npx playwright test tests/live-connection.spec.js tests/navigation.spec.js tests/miniapps.spec.js --browser=webkit --workers=1 --reporter=dot,github

      - name: Mobile send focus and button activation (WebKit)
        run: >-
          npx playwright test tests/chat.spec.js --browser=webkit
          --grep 'mobile composer activation|send preserves mouse focus'
          --workers=1 --reporter=dot,github

  speech:
    name: CPU speech appliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install locked appliance dependencies
        run: |
          uv venv --python 3.13 /tmp/stt-venv
          uv pip sync --python /tmp/stt-venv/bin/python services/stt/requirements.txt
      - name: Decode real audio and enforce appliance contract without model downloads
        working-directory: services/stt
        run: /tmp/stt-venv/bin/python -m unittest test_server -v

  images:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend, context: ., file: services/backend/Dockerfile }
          - { name: worker, context: ., file: services/worker/Dockerfile }
          - { name: workflow-mcp, context: ., file: services/workflow-mcp/Dockerfile }
          - { name: docker-broker, context: ., file: services/docker-broker/Dockerfile }
          - { name: frontend, context: services/frontend, file: services/frontend/Dockerfile }
          - { name: website, context: services/website, file: services/website/Dockerfile }
          - { name: agentgateway, context: services/agentgateway, file: services/agentgateway/Dockerfile }
          - { name: stt, context: services/stt, file: services/stt/Dockerfile }
          - { name: temporal, context: infra/temporal, file: infra/temporal/Dockerfile }
          - { name: otel-collector, context: infra/otel-collector, file: infra/otel-collector/Dockerfile }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  miniapps:
    name: Mini-app compiler and isolated runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build locked mini-app compiler
        uses: docker/build-push-action@v7
        with:
          context: services/miniapp-sdk
          load: true
          tags: nautionette/miniapp-builder:dev
          cache-from: type=gha,scope=miniapp-builder
          cache-to: type=gha,mode=max,scope=miniapp-builder
      - name: Build broker for real mini-app runtime tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/docker-broker/Dockerfile
          load: true
          tags: nautionette/docker-broker:dev
          cache-from: type=gha,scope=miniapp-test-broker
          cache-to: type=gha,mode=max,scope=miniapp-test-broker
      - name: Offline compiler, scratch runtime, SQLite, syscall and socket isolation
        run: |
          uv sync --locked --all-packages
          NAUTIONETTE_DOCKER_TESTS=1 uv run pytest tests/broker/test_miniapps_docker.py

  agent-images:
    name: Image (agent sets)
    needs: miniapps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build cached Pi base and agent set together
        uses: docker/bake-action@v7
        with:
          source: .
          files: images/agent-images.hcl
          load: true
          set: |
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Prepare and offline-reverify creative-app artifact volumes
        run: |
          docker run --rm --network none --cap-drop ALL --entrypoint sh nautionette/pi-agent-default:dev -c 'test ! -e /opt/artcraft/cadcraft/bin/cadcraft-cli'
          docker image inspect nautionette/pi-agent-default:dev --format 'Pi image bytes (without creative-app binaries): {{.Size}}'
          uv run python scripts/prepare_artcraft_test.py > /tmp/artcraft-mounts

      - name: Pi image transport and package RPC compatibility (offline)
        run: |
          mapfile -t artcraft_mounts < /tmp/artcraft-mounts
          docker run --rm --network none --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges \
            "${artcraft_mounts[@]}" \
            --env HOME=/workspace --env ARTCRAFT_REQUIRE_NATIVE=1 --tmpfs /workspace:rw,mode=1777 \
            --volume "$PWD:/source:ro" --entrypoint bash nautionette/pi-agent-default:dev -c \
            'pi --version && node --test /source/tests/agent/test_artcraft.mjs /source/tests/agent/test_artcraft_native.mjs /source/tests/agent/test_artcraft_rpc.mjs /source/tests/agent/test_chat_files.mjs /source/tests/agent/test_chat_session.mjs /source/tests/agent/test_chat_session_rpc.mjs /source/tests/agent/test_tool_context.mjs /source/tests/agent/test_tool_context_rpc.mjs /source/tests/agent/test_outputs.mjs /source/tests/agent/test_subagents.mjs /source/tests/agent/test_outputs_rpc.mjs /source/tests/agent/test_images.mjs /source/tests/agent/test_provider.ts /source/tests/agent/test_model_api.ts /source/tests/agent/test_reasoning.ts /source/tests/agent/test_tool_selection.ts /source/tests/agent/test_mcp_transport.mjs /source/tests/agent/test_image_transport.mjs /source/tests/agent/test_packages_rpc.mjs /source/tests/agent/test_context_usage.mjs /source/tests/agent/test_chat_control.mjs /source/tests/agent/test_chat_recovery.mjs /source/tests/agent/test_chat_recovery_rpc.mjs /source/tests/agent/test_project_git.mjs /source/tests/agent/test_telemetry.mjs'

      - name: Development tools work offline as the project user
        run: |
          docker run --rm --network none --user 10001:10001 \
            --env HOME=/workspace --tmpfs /workspace:rw,mode=1777 --shm-size=256m \
            --volume "$PWD/scripts/check-pi-dev-tools.sh:/check-pi-dev-tools.sh:ro" \
            --entrypoint bash nautionette/pi-agent-default:dev /check-pi-dev-tools.sh

      - name: Build locked mini-app compiler
        uses: docker/build-push-action@v7
        with:
          context: services/miniapp-sdk
          load: true
          tags: nautionette/miniapp-builder:dev
          cache-from: type=gha,scope=miniapp-builder
          cache-to: type=gha,mode=max,scope=miniapp-builder
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Git credential rotation in a live unprivileged container (offline)
        run: |
          uv sync --locked --all-packages
          NAUTIONETTE_DOCKER_TESTS=1 uv run pytest tests/broker/test_git_credentials_docker.py tests/broker/test_chat_sessions_docker.py

      # Publishing is part of CI, so Deploy cannot start before these images
      # exist. PR code never logs in or pushes (including same-repository PRs).
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Source fingerprints
        id: images
        run: python3 services/docker-broker/nautionette_docker_broker/image_context.py >> "$GITHUB_OUTPUT"

      - name: Publish tested agent images
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          REPOSITORY: ${{ github.repository }}
          BASE_HASH: ${{ steps.images.outputs.base }}
          DEFAULT_HASH: ${{ steps.images.outputs.default }}
          MINIAPP_HASH: ${{ steps.images.outputs.miniapp }}
        run: python3 scripts/publish_agent_images.py

  compose:
    name: Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Config resolves
        run: |
          cp .env.example .env
          MAXIO_SECRET_KEY="$(openssl rand -hex 32)" \
            docker compose --profile images --profile debug --profile observability config --quiet
