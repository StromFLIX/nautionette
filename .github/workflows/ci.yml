name: CI

# Every push to main and every pull request: lint, build the app, and run the
# one check that needs no running stack. Anything needing a model key lives in
# smoke.yml, because it costs money and cannot run on a fork.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag, so this is pinned exactly.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install workspace
        run: uv sync --locked --all-packages

      - name: Lint
        run: uv run ruff check --output-format github .

      - name: Format
        run: uv run ruff format --check .

      - name: Deployment, snapshot and agent image safety tests
        run: uv run pytest tests/test_coolify_release.py tests/test_staging_refresh.py tests/broker/test_broker.py

      - name: Model capability and image API guards
        run: uv run pytest tests/backend/test_catalog.py tests/backend/test_model_capabilities.py tests/backend/test_chat_images.py

      - name: Agent defaults, profiles and durable chat configuration
        run: uv run pytest tests/backend/test_agent_profiles.py tests/backend/test_reasoning.py tests/backend/test_settings.py tests/backend/test_chats.py tests/backend/test_backend_mcp.py

      - name: Committed workflows still validate
        run: uv run --package nautionette-workflow-mcp python scripts/check_workflows.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      # ci, not install: it fails when package.json and the lockfile disagree.
      - name: Install
        run: npm ci

      - name: Frontend unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Chat, settings, extensions and theme controls
        run: >-
          npx playwright test
          tests/chat.spec.js tests/appearance.spec.js tests/workspace.spec.js
          tests/projects.spec.js tests/settings-navigation.spec.js
          tests/git-authorship.spec.js tests/system.spec.js tests/agent-profiles.spec.js
          tests/packages.spec.js tests/new-chat-settings.spec.js --workers=1 --reporter=dot,github

  images:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend, context: ., file: services/backend/Dockerfile }
          - { name: worker, context: ., file: services/worker/Dockerfile }
          - { name: workflow-mcp, context: ., file: services/workflow-mcp/Dockerfile }
          - { name: docker-broker, context: ., file: services/docker-broker/Dockerfile }
          - { name: frontend, context: services/frontend, file: services/frontend/Dockerfile }
          - { name: website, context: services/website, file: services/website/Dockerfile }
          - { name: agentgateway, context: services/agentgateway, file: services/agentgateway/Dockerfile }
          - { name: temporal, context: infra/temporal, file: infra/temporal/Dockerfile }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  agent-images:
    name: Image (agent sets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build cached Pi base and agent set together
        uses: docker/bake-action@v7
        with:
          source: .
          files: images/agent-images.hcl
          load: true
          set: |
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Image transport uses each model's supported API (offline)
        run: |
          docker run --rm --network none --user 10001:10001 \
            --env HOME=/workspace --tmpfs /workspace:rw,mode=1777 \
            --volume "$PWD:/source:ro" --entrypoint bash nautionette/pi-agent-default:dev -c \
            'pi --version && node --test /source/tests/agent/test_images.mjs /source/tests/agent/test_provider.ts /source/tests/agent/test_model_api.ts /source/tests/agent/test_reasoning.ts /source/tests/agent/test_tool_selection.ts /source/tests/agent/test_image_transport.mjs'

      - name: Development tools work offline as the project user
        run: |
          docker run --rm --network none --user 10001:10001 \
            --env HOME=/workspace --tmpfs /workspace:rw,mode=1777 --shm-size=256m \
            --volume "$PWD/scripts/check-pi-dev-tools.sh:/check-pi-dev-tools.sh:ro" \
            --entrypoint bash nautionette/pi-agent-default:dev /check-pi-dev-tools.sh

      # Publishing is part of CI, so Deploy cannot start before these images
      # exist. PR code never logs in or pushes (including same-repository PRs).
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Source fingerprints
        id: images
        run: python3 services/docker-broker/nautionette_docker_broker/image_context.py >> "$GITHUB_OUTPUT"

      - name: Publish tested agent images
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          REPOSITORY: ${{ github.repository }}
          BASE_HASH: ${{ steps.images.outputs.base }}
          DEFAULT_HASH: ${{ steps.images.outputs.default }}
        run: |
          prefix="ghcr.io/${REPOSITORY,,}/pi-"
          docker tag nautionette/pi-base:dev "${prefix}base:${BASE_HASH}"
          docker tag nautionette/pi-agent-default:dev "${prefix}agent-default:${DEFAULT_HASH}"
          docker push "${prefix}base:${BASE_HASH}"
          docker push "${prefix}agent-default:${DEFAULT_HASH}"

  compose:
    name: Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Config resolves
        run: |
          cp .env.example .env
          docker compose --profile images --profile debug config --quiet
