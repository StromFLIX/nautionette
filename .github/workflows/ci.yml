name: CI

# Every push to main and every pull request: lint, build the app, and run the
# one check that needs no running stack. Anything needing a model key lives in
# smoke.yml, because it costs money and cannot run on a fork.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install workspace
        run: uv sync --locked --all-packages

      - name: Lint
        run: uv run ruff check --output-format github .

      - name: Format
        run: uv run ruff format --check .

      - name: Committed workflows still validate
        run: uv run --package nautionette-workflow-mcp python scripts/check_workflows.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      # ci, not install: it fails when package.json and the lockfile disagree.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  images:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend, context: ., file: services/backend/Dockerfile }
          - { name: worker, context: ., file: services/worker/Dockerfile }
          - { name: workflow-mcp, context: ., file: services/workflow-mcp/Dockerfile }
          - { name: docker-broker, context: ., file: services/docker-broker/Dockerfile }
          - { name: frontend, context: services/frontend, file: services/frontend/Dockerfile }
          - { name: website, context: services/website, file: services/website/Dockerfile }
          - { name: agentgateway, context: services/agentgateway, file: services/agentgateway/Dockerfile }
          - { name: temporal, context: infra/temporal, file: infra/temporal/Dockerfile }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  agent-images:
    name: Image (agent sets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # An agent set is FROM pi-base, so these two build in order with the plain
      # builder: a buildx container cannot see an image that was only loaded.
      - name: pi-base
        run: docker build -t nautionette/pi-base:dev images/pi-base

      - name: agent set default
        run: docker build -t nautionette/pi-agent-default:dev images/agent-sets/default

  compose:
    name: Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Config resolves
        run: |
          cp .env.example .env
          docker compose --profile images --profile debug config --quiet
