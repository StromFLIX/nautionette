name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: iOS simulator and unsigned device archive
    runs-on: macos-15
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - name: Select Xcode for Capacitor 8
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - run: npm ci
      - name: Use the release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --ignore-scripts --allow-same-version
      - run: npm run build
      - run: npm run ios:add
      - name: Build simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath out/simulator \
            MARKETING_VERSION="$(node -p 'require(\"./package.json\").version')" \
            CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent out/simulator/Build/Products/Debug-iphonesimulator/App.app out/nautionette-ios-simulator.zip
      - name: Archive for devices without signing
        # This is a build artifact, NOT a sideloadable IPA or App Store release.
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath out/Nautionette.xcarchive \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="$(node -p 'require(\"./package.json\").version')" \
            CODE_SIGNING_ALLOWED=NO archive
          ditto -c -k --keepParent out/Nautionette.xcarchive out/nautionette-ios-unsigned-archive.zip
      - uses: actions/upload-artifact@v7
        with:
          name: nautionette-ios-builds
          path: services/frontend/out/nautionette-ios-*.zip
          if-no-files-found: error
          retention-days: 30
