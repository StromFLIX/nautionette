name: Deploy

# No polling and no Nautionette chat calls: unrelated events do not make messages.
# Enable only AFTER the isolated staging clone and GitHub environments exist.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

# Serialize staging and production together, including the promotion check.
concurrency:
  group: coolify-nautionette-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.COOLIFY_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ github.event_name == 'release' && 'production' || 'staging' }}
    steps:
      # Never execute the control script from a PR artifact or release tag.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Pin, deploy, and verify
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          COOLIFY_STAGING_APPLICATION_UUID: ${{ vars.COOLIFY_STAGING_APPLICATION_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_URL: ${{ vars.APP_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: python3 scripts/coolify_release.py
