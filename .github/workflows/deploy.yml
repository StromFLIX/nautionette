name: Deploy

# No polling and no Nautionette chat calls: unrelated events do not make messages.
# Enable only AFTER the isolated staging clone and GitHub environments exist.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published stable release to promote (vX.Y.Z); run from main'
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Serialize staging and production together, including the promotion check.
concurrency:
  group: coolify-nautionette-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.COOLIFY_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    # Up to 105m durable migration + normal deploy, health and staging smokes.
    timeout-minutes: 180
    environment: ${{ github.event_name == 'workflow_run' && 'staging' || 'production' }}
    steps:
      # Environment rules evaluate the event ref: production allows main + v* tags.
      # Manual promotion is main-only. Always load trusted control code from main.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Pin, deploy, and verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          COOLIFY_STAGING_APPLICATION_UUID: ${{ vars.COOLIFY_STAGING_APPLICATION_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_URL: ${{ vars.APP_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          DEPLOY_HEALTH_TIMEOUT_SECONDS: ${{ vars.DEPLOY_HEALTH_TIMEOUT_SECONDS }}
        run: python3 -m scripts.coolify_release
      - name: Verify isolated mini-app lifecycle (staging only)
        if: github.event_name == 'workflow_run'
        env:
          APP_URL: ${{ vars.APP_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: python3 scripts/check_miniapps.py
      - name: Verify CLI and HTTPS MCP OAuth compatibility (staging only)
        if: github.event_name == 'workflow_run'
        env:
          APP_URL: ${{ vars.APP_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: python3 scripts/check_cli_oauth_deployment.py
      - uses: astral-sh/setup-uv@v10.3.3
        if: github.event_name == 'workflow_run'
      - name: Verify self-hosted streaming dictation over HTTPS and WebSocket (staging only)
        if: github.event_name == 'workflow_run'
        env:
          APP_URL: ${{ vars.APP_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: uv run --locked --package nautionette-backend python scripts/check_dictation_deployment.py
      - name: Creative-app artifact readiness diagnostics (staging only)
        if: always() && github.event_name == 'workflow_run'
        env:
          APP_URL: ${{ vars.APP_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: python3 scripts/check_artcraft_deployment.py
