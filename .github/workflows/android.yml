name: Android

# The app is the same dist/ the web serves, wrapped by Capacitor. Every push to
# main leaves a debug APK attached to the run; a tag also gets a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    # Only the tag path writes anything, and only to a release.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install
        run: npm ci

      - name: Build the web bundle
        run: npm run build

      # The native project is generated, not committed: it is a pure function of
      # capacitor.config.json, so there is nothing to drift or to review.
      - name: Generate the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Assemble
        working-directory: services/frontend/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name it after the commit
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/nautionette-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: nautionette-apk
          path: services/frontend/out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: services/frontend/out/*.apk
