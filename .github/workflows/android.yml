name: Android

# The app is the same dist/ the web serves, wrapped by Capacitor. Every push to
# main leaves a debug APK attached to the run; v* tags publish signed release APKs.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    # Only the tag path writes anything, and only to a release.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Require release signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing GitHub Actions secret: $key"
              exit 1
            fi
          done

      - name: Install
        run: npm ci

      - name: Build the web bundle
        run: npm run build

      # Generate Gradle files, then install the versioned native system-bar bridge.
      - name: Generate the Android project
        run: npm run android:add

      - name: Assemble debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        working-directory: services/frontend/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble unsigned release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: services/frontend/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign and verify release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash scripts/sign-android-release.sh \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "out/nautionette-${GITHUB_REF_NAME}-release.apk"

      - name: Name debug APK after the commit
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/nautionette-${GITHUB_SHA::7}-debug.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: nautionette-apk
          path: services/frontend/out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: services/frontend/out/*.apk
