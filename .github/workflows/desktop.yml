name: Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: windows-2025, platform: win, arch: x64 }
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
    defaults:
      run:
        working-directory: services/frontend
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - name: Use the release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --ignore-scripts --allow-same-version
      - name: Package desktop client
        # Unsigned by default. Never imply these installers are notarized.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:build -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Test packaged Linux renderer
        if: matrix.platform == 'linux'
        run: |
          npx playwright install-deps chromium
          xvfb-run -a node scripts/smoke-desktop.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: nautionette-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            services/frontend/out/desktop/*.dmg
            services/frontend/out/desktop/*.exe
            services/frontend/out/desktop/*.AppImage
          if-no-files-found: error
          retention-days: 30
      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            services/frontend/out/desktop/*.dmg
            services/frontend/out/desktop/*.exe
            services/frontend/out/desktop/*.AppImage
