receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 32
  transform/privacy:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - keep_keys(attributes, ["http.method", "http.status_code", "http.status", "http.route", "http.request.method", "http.response.status_code", "server.address", "server.port", "error.type", "rpc.system", "rpc.service", "rpc.method", "temporalWorkflowID", "temporalRunID", "temporalActivityID", "temporalActivityType", "temporalWorkflowType", "temporalAttempt", "nautionette.chat_id", "nautionette.turn_id", "nautionette.agent_set", "gen_ai.request.model", "gen_ai.operation.name", "gen_ai.tool.name", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens"])
          - set(status.message, "")
      - context: spanevent
        statements:
          - keep_keys(attributes, ["exception.type"])
  resource/gateway:
    attributes:
      - key: service.name
        value: nautionette-agentgateway
        action: insert
      - key: deployment.environment
        value: ${env:APP_ENVIRONMENT}
        action: upsert
      - key: deployment.environment.name
        value: ${env:APP_ENVIRONMENT}
        action: upsert
      - key: service.version
        value: ${env:APP_VERSION}
        action: upsert
  batch:
    send_batch_size: 256
    timeout: 5s
exporters:
  otlphttp/upstream:
    endpoint: ${env:OTEL_COLLECTOR_UPSTREAM_ENDPOINT}
    headers:
      Authorization: ${env:OTEL_COLLECTOR_UPSTREAM_AUTHORIZATION}
    timeout: 3s
    sending_queue:
      queue_size: 512
    retry_on_failure:
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, resource/gateway, batch]
      exporters: [otlphttp/upstream]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/gateway, batch]
      exporters: [otlphttp/upstream]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/gateway, batch]
      exporters: [otlphttp/upstream]
