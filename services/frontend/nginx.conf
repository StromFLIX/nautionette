server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Display branding can change without renaming its stable public paths.
    location /brand/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Every reload revalidates the shell; its compiled assets remain immutable.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
