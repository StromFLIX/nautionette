[project]
name = "nautionette-backend"
version = "0.1.0"
description = "The only entrypoint: auth, chats, workflows, triggers, streaming"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "temporalio>=1.9",
    "jsonschema>=4.23",
    "nautionette",
]

[tool.uv.sources]
nautionette = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nautionette_backend"]
