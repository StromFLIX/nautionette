[project]
name = "nautionette-workflow-mcp"
version = "0.1.0"
description = "Schema-validated workflow authoring tools, over MCP and REST"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "temporalio>=1.9",
    "nautionette",
]

[tool.uv.sources]
nautionette = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nautionette_workflow_mcp"]
