[project]
name = "nautionette-docker-broker"
version = "0.1.0"
description = "Fixed verbs over the Docker socket: run one agent container, restart workers"
requires-python = ">=3.13"
dependencies = [
    "docker>=7.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nautionette_docker_broker"]
