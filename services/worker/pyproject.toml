[project]
name = "nautionette-worker"
version = "0.1.0"
description = "Temporal workers that load workflow files from the shared volume"
requires-python = ">=3.13"
dependencies = [
    "temporalio>=1.9",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "nautionette",
]

[tool.uv.sources]
nautionette = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nautionette_worker"]
