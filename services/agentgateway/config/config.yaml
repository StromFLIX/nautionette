# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# This file is the read-only baseline. Runtime resources are persisted in the
# gateway database and merged over it. One gateway on 4000 serves LLM, MCP and
# the UI. Nothing is published to the host - the backend is the only door.

config:
  storage:
    mode: hybrid
  database:
    url: sqlite:///data/agentgateway.db

gateways:
  default:
    port: 4000

ui:
  gateways: default

# LLM integrations are runtime resources managed by the authenticated backend.
# OpenRouter is added once on upgrade to preserve the default experience.
llm:
  providers: []
  models: []
  virtualModels: []

# MCP traffic: one federated endpoint on /mcp for both workers and Pi agents.
mcp:
  targets:
    # Deterministic workflow authoring. This is how a promoted chat becomes a
    # workflow file, so scope it with mcpAuthorization before exposing it widely.
    - name: workflows
      mcp:
        host: http://workflow-mcp:8000/mcp
    # Further servers are added in the app, under Settings > MCP servers, and
    # persist as mcp.target resources beside them. Targets listed here are the
    # baseline the app cannot remove.
