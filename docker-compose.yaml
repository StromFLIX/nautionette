name: ${STACK_NAMESPACE:-nautionette}

x-telemetry: &telemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=nautionette,deployment.environment=${APP_ENVIRONMENT:-production},deployment.environment.name=${APP_ENVIRONMENT:-production},service.version=${APP_VERSION:-dev}
  APP_VERSION: ${APP_VERSION:-dev}
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # --------------------------------------------------------------- entrypoint

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    image: ${STACK_NAMESPACE:-nautionette}/backend:dev
    restart: unless-stopped
    # Active turns drain while HTTP/MCP is still serving, then clean up agents.
    # Keep this longer than BACKEND_CHAT_DRAIN_SECONDS (including cleanup headroom).
    stop_grace_period: ${BACKEND_STOP_GRACE_PERIOD:-3720s}
    # The application entrypoint, published only on the host loopback interface.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      <<: *telemetry
      APP_TOKEN: ${APP_TOKEN:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-nautionette}
      AGENTGATEWAY_URL: http://agentgateway:4000
      LLM_BASE_URL: http://agentgateway:4000/v1
      MCP_URL: http://agentgateway:4000/mcp
      BROKER_URL: http://docker-broker:9100
      WORKFLOW_MCP_URL: http://workflow-mcp:8000
      FRONTEND_WEB_URL: http://frontend-web:80
      WORKFLOWS_DIR: /workflows
      WORKFLOWS_SEED_DIR: /seed
      DATA_DIR: /data
      ARTIFACTS_DIR: /artifacts
      PROJECTS_DIR: /projects
      CHAT_SESSIONS_DIR: /chat-sessions
      APP_URL: ${APP_URL:-}
      OUTPUT_S3_ENDPOINT: http://maxio:9000
      OUTPUT_S3_BUCKET: ${OUTPUT_S3_BUCKET:-nautionette-outputs}
      OUTPUT_S3_REGION: ${OUTPUT_S3_REGION:-us-east-1}
      OUTPUT_S3_ACCESS_KEY: ${MAXIO_ACCESS_KEY:?Set MAXIO_ACCESS_KEY}
      OUTPUT_S3_SECRET_KEY: ${MAXIO_SECRET_KEY:?Set MAXIO_SECRET_KEY to a strong random secret}
      OUTPUT_STORAGE_DISK_PATH: /output-storage
      GITHUB_APP_PUBLIC_URL: ${GITHUB_APP_PUBLIC_URL:-}
      DEFAULT_AGENT_SET: ${DEFAULT_AGENT_SET:-default}
      AGENT_RUN_TIMEOUT_SECONDS: ${AGENT_RUN_TIMEOUT_SECONDS:-3600}
      BACKEND_CHAT_DRAIN_SECONDS: ${BACKEND_CHAT_DRAIN_SECONDS:-3600}
      AGENT_MODEL: ${AGENT_MODEL:-openai/gpt-4o-mini}
      # Set to any non-empty value when a provider key is configured; the app
      # also flips it on by itself after the first agent call that works.
      MODEL_KEY_PRESENT: ${MODEL_KEY_PRESENT:-}
    volumes:
      - workflows:/workflows
      - artifacts:/artifacts
      - backend-data:/data
      - projects:/projects
      - chat-sessions:/chat-sessions
      # Measure the actual MaxIO backing filesystem without write access to it.
      - maxio-data:/output-storage:ro
    networks: [edge, internal, control, outputs]
    depends_on:
      temporal:
        condition: service_started
      agentgateway:
        condition: service_started
      docker-broker:
        condition: service_started
      frontend-web:
        condition: service_started
      maxio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=4).read()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    <<: *logging

  # The promotional site. Static, separate from the app, its own domain.
  website:
    build:
      context: ./services/website
    image: ${STACK_NAMESPACE:-nautionette}/website:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBSITE_PORT:-8081}:80"
    environment:
      APP_URL: ${APP_URL:-}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "4", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    <<: *logging

  # -------------------------------------------------------------- control plane

  docker-broker:
    build:
      context: .
      dockerfile: services/docker-broker/Dockerfile
    image: ${STACK_NAMESPACE:-nautionette}/docker-broker:dev
    restart: unless-stopped
    # Trust boundary. Only container with the Docker socket, so it exposes fixed
    # verbs (run_agent / restart_worker) and never a generic run call.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - projects:/projects:ro
      - chat-sessions:/chat-sessions
    environment:
      <<: *telemetry
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      TARGET_NETWORK: ${STACK_NAMESPACE:-nautionette}-internal
      AGENT_NETWORK: ${STACK_NAMESPACE:-nautionette}-agent-sandboxes
      # Coolify rewrites service volume names; pass its rendered name there.
      WORKFLOWS_VOLUME: ${BROKER_WORKFLOWS_VOLUME:-${STACK_NAMESPACE:-nautionette}-workflows}
      IMAGE_PREFIX: ${STACK_NAMESPACE:-nautionette}/pi-
      BASE_IMAGE: ${STACK_NAMESPACE:-nautionette}/pi-base:dev
      AGENT_IMAGE_REGISTRY_PREFIX: ${AGENT_IMAGE_REGISTRY_PREFIX:-}
      WORKER_SERVICE_LABEL: com.docker.compose.service=worker
      WORKER_IMAGE: ${STACK_NAMESPACE:-nautionette}/worker:dev
      WORKER_REPLICAS: ${WORKER_REPLICAS:-1}
      CONTAINER_RECONCILE_SECONDS: ${CONTAINER_RECONCILE_SECONDS:-30}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-nautionette}
      WORKER_GRACE_SECONDS: ${WORKER_GRACE_SECONDS:-50}
      # One container per agent call, so the only knob is how long a single call
      # may take before it is killed.
      AGENT_RUN_TIMEOUT_SECONDS: ${AGENT_RUN_TIMEOUT_SECONDS:-3600}
      # Large model payloads need serialization headroom; workspace tmpfs counts
      # toward the same per-agent memory limit.
      AGENT_MEMORY_LIMIT: ${AGENT_MEMORY_LIMIT:-4g}
      AGENT_WORKSPACE_SIZE: ${AGENT_WORKSPACE_SIZE:-1g}
      CHAT_SESSIONS_DIR: /chat-sessions
      CHAT_SESSION_MAX_BYTES: ${CHAT_SESSION_MAX_BYTES:-268435456}
      WORKER_STOP_GRACE_SECONDS: ${WORKER_STOP_GRACE_SECONDS:-60}
      # Injected into the Pi containers this broker runs.
      AGENT_AGENTGATEWAY_URL: http://agentgateway:4000
      AGENT_BACKEND_URL: http://backend:8080
    networks: [control, internal]
    depends_on:
      worker:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,sys,urllib.request;sys.exit(json.load(urllib.request.urlopen('http://127.0.0.1:9100/healthz',timeout=4))['status'] != 'ok')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    <<: *logging

  # ------------------------------------------------------------------- tooling

  # https://agentgateway.dev - fronts MCP servers and the model provider. The
  # upstream binary plus Node/Python runtimes for trusted stdio MCP targets.
  agentgateway:
    build:
      context: ./services/agentgateway
      args:
        AGENTGATEWAY_VERSION: ${AGENTGATEWAY_VERSION:-v1.7.0}
    image: ${STACK_NAMESPACE:-nautionette}/agentgateway:dev
    restart: unless-stopped
    command: ["-f", "/config/config.yaml"]
    # Reap descendants of short-lived stdio sessions; no Docker socket is mounted.
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *telemetry
      OTEL_SERVICE_NAME: nautionette-agentgateway
      # Optional: a key entered in Settings > Agents is stored by agentgateway itself.
      # These let an integration reference $VARIABLE instead of holding the key.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GH_COPILOT_TOKEN: ${GH_COPILOT_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    volumes:
      - agentgateway-data:/data
    networks: [internal, agents]
    depends_on:
      - workflow-mcp
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/busybox",
          "wget",
          "-q",
          "-T",
          "4",
          "-O",
          "/dev/null",
          "http://127.0.0.1:15021/healthz/ready",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    <<: *logging

  # An MCP target behind agentgateway, never called directly by an agent. Holds
  # the deterministic authoring tools that make promotion possible.
  workflow-mcp:
    build:
      context: .
      dockerfile: services/workflow-mcp/Dockerfile
    image: ${STACK_NAMESPACE:-nautionette}/workflow-mcp:dev
    restart: unless-stopped
    environment:
      <<: *telemetry
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      WORKFLOWS_DIR: /workflows
      BACKEND_URL: http://backend:8080
    volumes:
      - workflows:/workflows
    networks: [internal]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=4).read()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5
    <<: *logging

  # Private S3-compatible binary storage. No host ports or public console.
  # Sandboxes have only expiring, size/checksum-bound object URLs, not credentials.
  # MaxIO is early upstream software; pin it and back up this volume with SQLite.
  maxio:
    image: ghcr.io/coollabsio/maxio:${MAXIO_VERSION:-0.4.2}
    restart: unless-stopped
    environment:
      MAXIO_ACCESS_KEY: ${MAXIO_ACCESS_KEY:?Set MAXIO_ACCESS_KEY}
      MAXIO_SECRET_KEY: ${MAXIO_SECRET_KEY:?Set MAXIO_SECRET_KEY to a strong random secret}
      MAXIO_REGION: ${OUTPUT_S3_REGION:-us-east-1}
      MAXIO_DEFAULT_BUCKETS: ${OUTPUT_S3_BUCKET:-nautionette-outputs}
      MAXIO_DATA_DIR: /data
    volumes:
      - maxio-data:/data
    networks: [outputs, agents]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "maxio", "healthcheck", "--url", "http://127.0.0.1:9000/healthz", "--timeout-ms", "2000"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    <<: *logging

  # ----------------------------------------------------------------- execution

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    image: ${STACK_NAMESPACE:-nautionette}/worker:dev
    restart: unless-stopped
    # Never scales to zero: something must always be able to pick work up.
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    environment:
      <<: *telemetry
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-nautionette}
      BACKEND_URL: http://backend:8080
      MCP_URL: http://agentgateway:4000/mcp
      WORKFLOWS_DIR: /workflows
      ARTIFACTS_DIR: /artifacts
      WORKER_GRACE_SECONDS: ${WORKER_GRACE_SECONDS:-50}
    volumes:
      - workflows:/workflows
      - artifacts:/artifacts
    networks: [internal]
    depends_on:
      - temporal
    # Let in-flight activities drain instead of being killed on restart.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-m", "nautionette_worker.health"]
      interval: 10s
      timeout: 5s
      start_period: 360s
      retries: 3
    <<: *logging

  temporal:
    build:
      context: ./infra/temporal
      args:
        TEMPORAL_VERSION: ${TEMPORAL_VERSION:-1.29.7}
    image: ${STACK_NAMESPACE:-nautionette}/temporal:dev
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      # Temporal is on more than one network; without this it binds to whichever
      # interface it happens to see first and the rest of the stack gets refused.
      BIND_ON_IP: 0.0.0.0
    networks: [internal, data]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "temporal",
          "--address",
          "127.0.0.1:7233",
          "--command-timeout",
          "4s",
          "operator",
          "cluster",
          "health",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    <<: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: temporal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-temporal}"]
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *logging

  # ------------------------------------------------------------------ frontend

  # One Quasar (Vue 3) codebase; this is its web target. Not published: the
  # backend reverse-proxies it, so there is still one door.
  frontend-web:
    build:
      context: ./services/frontend
    image: ${STACK_NAMESPACE:-nautionette}/frontend:dev
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "4", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    <<: *logging

  # ------------------------------------- agent images: built here, never run here
  # The broker pulls prebuilt versions when configured, or builds locally, and
  # runs one container per agent call.
  #   docker compose --profile images build

  pi-base:
    build: ./images/pi-base
    image: ${STACK_NAMESPACE:-nautionette}/pi-base:dev
    profiles: [images]
    entrypoint: ["true"]

  pi-agent-default:
    build:
      context: ./images/agent-sets/default
      args:
        BASE_IMAGE: ${STACK_NAMESPACE:-nautionette}/pi-base:dev
    image: ${STACK_NAMESPACE:-nautionette}/pi-agent-default:dev
    profiles: [images]
    entrypoint: ["true"]
    depends_on: [pi-base]

  # -------------------------------------------------------------- observability
  # Optional locally; enabled in Coolify with COMPOSE_PROFILES=observability.
  # Only this vendor-neutral relay is reachable from agent sandboxes, not the telemetry database.
  otel-collector:
    profiles: [observability]
    build: ./infra/otel-collector
    image: ${STACK_NAMESPACE:-nautionette}/otel-collector:dev
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      OTEL_COLLECTOR_UPSTREAM_ENDPOINT: ${OTEL_COLLECTOR_UPSTREAM_ENDPOINT:-http://127.0.0.1:9}
      OTEL_COLLECTOR_UPSTREAM_AUTHORIZATION: ${OTEL_COLLECTOR_UPSTREAM_AUTHORIZATION:-}
    mem_limit: 256m
    networks: [internal, agents]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/busybox",
          "wget",
          "-q",
          "-T",
          "4",
          "-O",
          "/dev/null",
          "http://127.0.0.1:13133/",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    <<: *logging

  # --------------------------------------------------------------------- debug
  # docker compose --profile debug up -d

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.57.0}
    profiles: [debug]
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "127.0.0.1:8233:8080"
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "4", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  # Published traffic only. Nothing but the backend and the site join this.
  edge:
    name: ${STACK_NAMESPACE:-nautionette}-edge
  # Service-to-service. Not internal:true - the gateway needs outbound to the
  # model provider. Isolation here comes from publishing no ports.
  internal:
    name: ${STACK_NAMESPACE:-nautionette}-internal
  # Sandboxes have outbound internet, gateway access and signed MaxIO transfers,
  # not membership in the backend's service networks.
  # A new name avoids reusing the old internal-only network during upgrades.
  agents:
    name: ${STACK_NAMESPACE:-nautionette}-agent-sandboxes
  # Backend to private object storage. Not reachable by sandbox network members
  # except MaxIO itself, which also serves signed transfers on the agents network.
  outputs:
    name: ${STACK_NAMESPACE:-nautionette}-outputs
    internal: true
  # Backend to broker only, no outbound.
  control:
    name: ${STACK_NAMESPACE:-nautionette}-control
    internal: true
  # Temporal to Postgres only, no outbound.
  data:
    name: ${STACK_NAMESPACE:-nautionette}-data
    internal: true

volumes:
  # Namespaced: each broker attaches only its own stack's workflow volume.
  workflows:
    name: ${STACK_NAMESPACE:-nautionette}-workflows
  projects:
    name: ${STACK_NAMESPACE:-nautionette}-projects
  chat-sessions:
  artifacts:
  backend-data:
  maxio-data:
  agentgateway-data:
  postgres-data:
