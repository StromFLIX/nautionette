name: nautionette

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # --------------------------------------------------------------- entrypoint

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    image: nautionette/backend:dev
    restart: unless-stopped
    # The only service in the stack that reaches the outside world.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      APP_TOKEN: ${APP_TOKEN:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-nautionette}
      AGENTGATEWAY_URL: http://agentgateway:4000
      LLM_BASE_URL: http://agentgateway:4000/v1
      MCP_URL: http://agentgateway:4000/mcp
      BROKER_URL: http://docker-broker:9100
      WORKFLOW_MCP_URL: http://workflow-mcp:8000
      FRONTEND_WEB_URL: http://frontend-web:80
      WORKFLOWS_DIR: /workflows
      WORKFLOWS_SEED_DIR: /seed
      DATA_DIR: /data
      ARTIFACTS_DIR: /artifacts
      DEFAULT_AGENT_SET: ${DEFAULT_AGENT_SET:-default}
      AGENT_MODEL: ${AGENT_MODEL:-openai/gpt-4o-mini}
      # Set to any non-empty value when a provider key is configured; the app
      # also flips it on by itself after the first agent call that works.
      MODEL_KEY_PRESENT: ${MODEL_KEY_PRESENT:-}
    volumes:
      - workflows:/workflows
      - artifacts:/artifacts
      - backend-data:/data
    networks: [edge, internal, control]
    depends_on:
      temporal:
        condition: service_started
      agentgateway:
        condition: service_started
      docker-broker:
        condition: service_started
      frontend-web:
        condition: service_started
    <<: *logging

  # The promotional site. Static, separate from the app, its own domain.
  website:
    build:
      context: ./services/website
    image: nautionette/website:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBSITE_PORT:-8081}:80"
    environment:
      APP_URL: ${APP_URL:-}
    networks: [edge]
    <<: *logging

  # -------------------------------------------------------------- control plane

  docker-broker:
    build:
      context: .
      dockerfile: services/docker-broker/Dockerfile
    image: nautionette/docker-broker:dev
    restart: unless-stopped
    # Trust boundary. Only container with the Docker socket, so it exposes fixed
    # verbs (run_agent / restart_worker) and never a generic run call.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      TARGET_NETWORK: nautionette-internal
      WORKFLOWS_VOLUME: nautionette-workflows
      IMAGE_PREFIX: nautionette/pi-
      BASE_IMAGE: nautionette/pi-base:dev
      WORKER_SERVICE_LABEL: com.docker.compose.service=worker
      # One container per agent call, so the only knob is how long a single call
      # may take before it is killed.
      AGENT_RUN_TIMEOUT_SECONDS: ${AGENT_RUN_TIMEOUT_SECONDS:-900}
      AGENT_MEMORY_LIMIT: ${AGENT_MEMORY_LIMIT:-1g}
      WORKER_STOP_GRACE_SECONDS: ${WORKER_STOP_GRACE_SECONDS:-60}
      # Injected into the Pi containers this broker runs.
      AGENT_AGENTGATEWAY_URL: http://agentgateway:4000
      AGENT_BACKEND_URL: http://backend:8080
    networks: [control, internal]
    security_opt:
      - no-new-privileges:true
    <<: *logging

  # ------------------------------------------------------------------- tooling

  # https://agentgateway.dev - fronts MCP servers and the model provider. The
  # upstream image with our config baked in, so nothing depends on a host path.
  agentgateway:
    build:
      context: ./services/agentgateway
      args:
        AGENTGATEWAY_VERSION: ${AGENTGATEWAY_VERSION:-v1.5.0}
    image: nautionette/agentgateway:dev
    restart: unless-stopped
    command: ["-f", "/config/config.yaml"]
    environment:
      # Provider credentials, read only by agentgateway. Each one enables the matching
      # integration in Settings > Agents; a custom integration needs its variable added here.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GH_COPILOT_TOKEN: ${GH_COPILOT_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    volumes:
      - agentgateway-data:/data
    networks: [internal]
    depends_on:
      - workflow-mcp
    <<: *logging

  # An MCP target behind agentgateway, never called directly by an agent. Holds
  # the deterministic authoring tools that make promotion possible.
  workflow-mcp:
    build:
      context: .
      dockerfile: services/workflow-mcp/Dockerfile
    image: nautionette/workflow-mcp:dev
    restart: unless-stopped
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      WORKFLOWS_DIR: /workflows
      BACKEND_URL: http://backend:8080
    volumes:
      - workflows:/workflows
    networks: [internal]
    <<: *logging

  # ----------------------------------------------------------------- execution

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    image: nautionette/worker:dev
    restart: unless-stopped
    # Never scales to zero: something must always be able to pick work up.
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-nautionette}
      BACKEND_URL: http://backend:8080
      MCP_URL: http://agentgateway:4000/mcp
      WORKFLOWS_DIR: /workflows
      ARTIFACTS_DIR: /artifacts
      WORKER_GRACE_SECONDS: ${WORKER_GRACE_SECONDS:-50}
    volumes:
      - workflows:/workflows
      - artifacts:/artifacts
    networks: [internal]
    depends_on:
      - temporal
    # Let in-flight activities drain instead of being killed on restart.
    stop_grace_period: 60s
    <<: *logging

  temporal:
    build:
      context: ./infra/temporal
      args:
        TEMPORAL_VERSION: ${TEMPORAL_VERSION:-1.29.0}
    image: nautionette/temporal:dev
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      # Temporal is on more than one network; without this it binds to whichever
      # interface it happens to see first and the rest of the stack gets refused.
      BIND_ON_IP: 0.0.0.0
    networks: [internal, data]
    depends_on:
      postgres:
        condition: service_healthy
    <<: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: temporal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-temporal}"]
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *logging

  # ------------------------------------------------------------------ frontend

  # One Quasar (Vue 3) codebase; this is its web target. Not published: the
  # backend reverse-proxies it, so there is still one door.
  frontend-web:
    build:
      context: ./services/frontend
    image: nautionette/frontend:dev
    restart: unless-stopped
    networks: [internal]
    <<: *logging

  # ------------------------------------- agent images: built here, never run here
  # The broker builds these at startup and runs one container per agent call.
  #   docker compose --profile images build

  pi-base:
    build: ./images/pi-base
    image: nautionette/pi-base:dev
    profiles: [images]
    entrypoint: ["true"]

  pi-agent-default:
    build: ./images/agent-sets/default
    image: nautionette/pi-agent-default:dev
    profiles: [images]
    entrypoint: ["true"]
    depends_on: [pi-base]

  # --------------------------------------------------------------------- debug
  # docker compose --profile debug up -d

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.34.0}
    profiles: [debug]
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "127.0.0.1:8233:8080"
    networks: [internal]

networks:
  # Published traffic only. Nothing but the backend and the site join this.
  edge:
    name: nautionette-edge
  # Service-to-service. Not internal:true - the gateway needs outbound to the
  # model provider. Isolation here comes from publishing no ports.
  internal:
    name: nautionette-internal
  # Backend to broker only, no outbound.
  control:
    name: nautionette-control
    internal: true
  # Temporal to Postgres only, no outbound.
  data:
    name: nautionette-data
    internal: true

volumes:
  # Fixed name: the broker attaches this volume to the Pi containers it runs.
  workflows:
    name: nautionette-workflows
  artifacts:
  backend-data:
  agentgateway-data:
  postgres-data:
