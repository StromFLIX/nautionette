name: agentic-flow

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # --------------------------------------------------------------- entrypoint

  backend:
    build: ./services/backend
    image: agentic-flow/backend:dev
    restart: unless-stopped
    # The only service in the stack that publishes a port.
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-agentic-flow}
      AGENTGATEWAY_URL: http://agentgateway:4000
      LLM_BASE_URL: http://agentgateway:4000/v1
      MCP_URL: http://agentgateway:4000/mcp
      BROKER_URL: http://docker-broker:9100
      FRONTEND_WEB_URL: http://frontend-web:80
      WORKFLOWS_DIR: /workflows
      WORKFLOWS_SEED_DIR: /seed
      S3_ENDPOINT: http://maxio:9000
      S3_BUCKET: ${S3_BUCKET:-agentic-flow}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - workflows:/workflows
      - backend-data:/data
      - ./workflows:/seed:ro
    networks: [edge, internal, control]
    depends_on:
      - temporal
      - agentgateway
      - docker-broker
      - frontend-web
    <<: *logging

  # -------------------------------------------------------------- control plane

  docker-broker:
    build: ./services/docker-broker
    image: agentic-flow/docker-broker:dev
    restart: unless-stopped
    # Trust boundary. Only container with the Docker socket, so it must expose
    # fixed verbs (spawn / stop / restart_worker) and never a generic run call.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      BROKER_PORT: 9100
      TARGET_NETWORK: agentic-flow-internal
      WORKFLOWS_VOLUME: agentic-flow-workflows
      ALLOWED_IMAGE_PREFIX: agentic-flow/pi-
      WORKER_SERVICE_LABEL: com.docker.compose.service=worker
      AGENT_IDLE_TIMEOUT_SECONDS: ${AGENT_IDLE_TIMEOUT_SECONDS:-900}
      PINNED_AGENT_SETS: ${PINNED_AGENT_SETS:-}
      # Injected into the Pi containers this broker spawns.
      AGENT_AGENTGATEWAY_URL: http://agentgateway:4000
      AGENT_BACKEND_URL: http://backend:8080
    networks: [control]
    security_opt:
      - no-new-privileges:true
    <<: *logging

  # ------------------------------------------------------------------- tooling

  # https://agentgateway.dev - fronts MCP servers and the model provider.
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:${AGENTGATEWAY_VERSION:-v1.5.0}
    restart: unless-stopped
    command: ["-f", "/config/config.yaml"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
    volumes:
      - ./services/agentgateway/config:/config:ro
      - agentgateway-data:/data
    networks: [internal]
    depends_on:
      - workflow-mcp
    <<: *logging

  # An MCP target behind agentgateway, never called directly. Holds the
  # deterministic workflow authoring tools that make promotion possible.
  workflow-mcp:
    build: ./services/workflow-mcp
    image: agentic-flow/workflow-mcp:dev
    restart: unless-stopped
    environment:
      MCP_PORT: 8000
      WORKFLOWS_DIR: /workflows
      BACKEND_URL: http://backend:8080
    volumes:
      - workflows:/workflows
    networks: [internal]
    <<: *logging

  # ----------------------------------------------------------------- execution

  worker:
    build: ./services/worker
    image: agentic-flow/worker:dev
    restart: unless-stopped
    # Never scales to zero: something must always be able to pick work up.
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-agentic-flow}
      AGENTGATEWAY_URL: http://agentgateway:4000
      LLM_BASE_URL: http://agentgateway:4000/v1
      MCP_URL: http://agentgateway:4000/mcp
      BACKEND_URL: http://backend:8080
      WORKFLOWS_DIR: /workflows
    volumes:
      - workflows:/workflows
    networks: [internal]
    depends_on:
      - temporal
      - agentgateway
    # Let in-flight activities drain instead of being killed on restart.
    stop_grace_period: 60s
    <<: *logging

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.25.2}
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks: [internal, data]
    depends_on:
      postgres:
        condition: service_healthy
    <<: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: temporal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-temporal}"]
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *logging

  # ------------------------------------------------------------------ frontend

  # One Quasar (Vue 3) codebase; this is its web target. Not published, the
  # backend reverse-proxies it, so there is still one door.
  frontend-web:
    build: ./services/frontend
    image: agentic-flow/frontend:dev
    restart: unless-stopped
    networks: [internal]
    <<: *logging

  # ------------------------------------------------------------------- storage

  # https://github.com/coollabsio/maxio - S3-compatible, single binary.
  maxio:
    image: ghcr.io/coollabsio/maxio:${MAXIO_VERSION:-v0.4.2}
    restart: unless-stopped
    environment:
      MAXIO_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MAXIO_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      MAXIO_DEFAULT_BUCKETS: ${S3_BUCKET:-agentic-flow}
      MAXIO_DATA_DIR: /data
    volumes:
      - maxio-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "maxio", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
    <<: *logging

  # ------------------------------------- agent images: built here, never run here
  # The broker starts these on demand and stops them when idle.
  #   docker compose --profile images build

  pi-base:
    build: ./images/pi-base
    image: agentic-flow/pi-base:dev
    profiles: [images]
    entrypoint: ["true"]

  pi-agent-default:
    build: ./images/agent-sets/default
    image: agentic-flow/pi-agent-default:dev
    profiles: [images]
    entrypoint: ["true"]
    depends_on: [pi-base]

  # --------------------------------------------------------------------- debug
  # docker compose --profile debug up -d

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.31.2}
    profiles: [debug]
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "127.0.0.1:8233:8080"
    networks: [internal]

networks:
  # Published traffic only. Nothing but the backend joins this.
  edge:
    name: agentic-flow-edge
  # Service-to-service. Not internal:true - the gateway needs outbound to the
  # model provider. Isolation here comes from publishing no ports.
  internal:
    name: agentic-flow-internal
  # Backend to broker only, no outbound.
  control:
    name: agentic-flow-control
    internal: true
  # Temporal to Postgres only, no outbound.
  data:
    name: agentic-flow-data
    internal: true

volumes:
  # Fixed name: the broker attaches this volume to the Pi containers it spawns.
  workflows:
    name: agentic-flow-workflows
  backend-data:
  agentgateway-data:
  postgres-data:
  maxio-data:
